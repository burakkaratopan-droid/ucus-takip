name: Fiyat taraması

on:
  schedule:
    # UTC saatleri; Türkiye saatiyle 08:00, 14:00, 20:00
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Tarama yapmadan sadece test alarmı gönder"
        type: boolean
        default: false
      probe:
        description: "Tarama yapmadan çoklu şehir teşhis sorgusu çalıştır"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test alarmı
        if: ${{ inputs.test_alarm }}
        run: python tracker.py --test-alarm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Teşhis
        if: ${{ inputs.probe }}
        run: |
          python tracker.py --probe
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "Teşhis çıktısı"
          git pull --rebase
          git push
      - name: Tarama
        if: ${{ !inputs.test_alarm && !inputs.probe }}
        run: python tracker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonuçları kaydet
        if: ${{ !inputs.test_alarm && !inputs.probe }}
        run: |
          git config user.name "fiyat-botu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Fiyat taraması $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
